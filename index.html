/* NAVIGATION */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;

}

.nav-links a:hover {
    color: #ffffff;

/* HERO */

.hero {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 20px;
    background:
        radial-gradient(circle at 50% 30%, rgba(110,40,255,0.25), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(0,220,255,0.15), transparent 35%);
}

.hero-content {
    max-width: 900px;
}

.hero h1 {
    font-size: clamp(60px, 13vw, 150px);
    letter-spacing: 15px;
    font-weight: 900;
    background: linear-gradient(90deg,#ffffff,#9e7cff,#00eaff);
    -webkit-background-clip: text;
    color: transparent;
}

.hero h2 {
    margin-top: 10px;
    font-size: clamp(25px,5vw,55px);
    letter-spacing: 5px;
}

.hero p {
    margin: 25px auto;
    max-width: 650px;
    color: #aaaab7;
    font-size: 18px;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 30px;
    border: 1px solid #8d63ff;
    border-radius: 6px;
    background: linear-gradient(90deg,#7b45ff,#00cfff);
    font-weight: bold;
    box-shadow: 0 0 30px rgba(105,60,255,0.3);
}

.btn:hover {
    transform: translateY(-2px);
}
